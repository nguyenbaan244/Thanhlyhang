<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanh lý nội bộ</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/shop.js"></script>
<header><div class="brand"><span class="mark" aria-hidden="true">↗</span> Thanh lý nội bộ</div></header>
<main>
  <section class="hero">
    <h1>Kho thanh lý</h1>
    <p>Xem tồn kho, chọn sản phẩm và đặt hàng bằng mã nhân viên.</p>
  </section>
  <form id="access" class="panel">
    <h2>Truy cập cửa hàng</h2>
    <label>Mã truy cập nội bộ<input name="code" type="password" required maxlength="200" autocomplete="off"></label>
    <button>Mở danh mục</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="layout" id="shop" hidden>
    <section class="panel">
      <div class="heading"><h2>Sản phẩm</h2><button id="refresh" type="button" class="secondary">Cập nhật tồn</button></div>
      <ul id="products"></ul>
    </section>
    <form id="order" class="panel">
      <h2>Đặt hàng</h2>
      <p id="selected">Chọn một sản phẩm trong danh mục.</p>
      <fieldset disabled>
        <label>Họ và tên<input name="name" maxlength="120" autocomplete="name" required></label>
        <label>Mã nhân viên<input name="employee" maxlength="40" autocomplete="off" required></label>
        <label>Số lượng<input name="quantity" type="number" min="1" step="1" value="1" required></label>
        <div class="summary"><span>Tổng tiền</span><strong id="total">—</strong></div>
        <button id="confirm">Xác nhận đặt hàng</button>
      </fieldset>
    </form>
  </div>
</main>
</html>
